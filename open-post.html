<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Открываем материал…</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c1116;color:#f3f7f5;font:16px Arial,sans-serif}
    main{max-width:420px;padding:32px;text-align:center}
    a{display:inline-block;margin-top:18px;padding:12px 16px;border-radius:10px;background:#00ff94;color:#102018;font-weight:700;text-decoration:none}
    p{color:#99a59f;line-height:1.45}
  </style>
</head>
<body>
  <main>
    <h1>Открываем материал…</h1>
    <p>Если Telegram не открылся автоматически, нажмите кнопку.</p>
    <a id="open" href="#">Открыть пост в Telegram</a>
  </main>
  <script>
    const params=new URLSearchParams(location.search);
    const channel=params.get('channel')||'';
    const post=params.get('post')||'';
    const valid=/^\d+$/.test(channel)&&/^\d+$/.test(post);
    const deepLink=valid?`tg://privatepost?channel=${channel}&post=${post}`:'';
    const button=document.getElementById('open');
    if(valid){
      button.href=deepLink;
      window.location.replace(deepLink);
    }else{
      document.querySelector('h1').textContent='Некорректная ссылка';
      document.querySelector('p').textContent='Не удалось определить канал или сообщение.';
      button.hidden=true;
    }
  </script>
</body>
</html>
