  <style>
    :root{--ink:#f3f7f5;--mint:#00ff94;--paper:#0c1116;--muted:#99a59f;--line:#283039;--card:#161d25;--card-hi:#1b242d}
    *{box-sizing:border-box} body{margin:0;background:#050707;color:var(--ink);font:15px/1.35 Arial,Helvetica,sans-serif}
    button,input{font:inherit} button{border:0;cursor:pointer;color:inherit}
    .phone{width:min(100%,430px);min-height:100vh;margin:auto;background:radial-gradient(480px 260px at 50% -80px,rgba(0,255,148,.14),transparent 70%),radial-gradient(330px 270px at 100% 42%,rgba(42,113,255,.10),transparent 70%),var(--paper);padding:22px 16px 92px}
    .topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#c9d3ce}.avatar{width:36px;height:36px;overflow:hidden;border-radius:50%;background:#161d25;box-shadow:0 0 22px rgba(254,153,3,.58)}.avatar img{display:block;width:100%;height:100%;object-fit:cover}
    h1{font-size:30px;line-height:1.03;letter-spacing:-.045em;margin:0 0 8px} .lead{color:var(--muted);margin:0 0 22px}
    .search{position:relative;margin:0 0 18px}.search input{width:100%;border:1px solid #33404a;border-radius:14px;padding:14px 14px 14px 46px;background:#151c23;color:var(--ink);outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}.search input::placeholder{color:#85918c}.search input:focus{border-color:rgba(0,255,148,.7);box-shadow:0 0 0 3px rgba(0,255,148,.12)}.search-icon{position:absolute;left:15px;top:50%;z-index:1;width:18px;height:18px;transform:translateY(-50%);color:#b9c3be;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;pointer-events:none}
    .section-title{display:flex;align-items:center;justify-content:space-between;font-size:17px;font-weight:800;margin:25px 0 12px}.section-title button{color:var(--mint);background:none;font-weight:700}
    .entry{display:flex;align-items:center;gap:13px;width:100%;padding:15px 14px;margin:8px 0;border:1px solid rgba(255,255,255,.055);border-radius:15px;background:linear-gradient(135deg,var(--card-hi),var(--card));text-align:left;box-shadow:0 10px 24px rgba(0,0,0,.12)} .entry:active{transform:scale(.99)}
    .icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#252e38;border:1px solid #3a4652;font-size:20px;flex:none}.entry strong{display:block;font-size:15px}.entry span{font-size:12px;color:var(--muted);display:block;margin-top:2px}.arrow{margin-left:auto;color:#afbbb4;font-size:20px}
    .chips{display:flex;gap:8px;overflow:auto;padding-bottom:2px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid #34404a;border-radius:999px;padding:9px 12px;background:#151c23;color:#cdd6d1;font-size:13px;font-weight:700}.chip.active{background:var(--mint);border-color:var(--mint);color:#0e2018;box-shadow:0 0 18px rgba(0,255,148,.2)}
      .card{position:relative;background:linear-gradient(145deg,#1b232c,#141a20);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:15px 46px 15px 15px;margin:10px 0;box-shadow:0 12px 25px rgba(0,0,0,.14)}.card h3{font-size:16px;line-height:1.18;margin:0 0 8px;letter-spacing:-.015em}.meta,.tags{font-size:12px;color:var(--muted)}.tags{margin-top:10px;color:#c4d1ca}.tag{display:inline-block;background:#28333a;border:1px solid #34434a;border-radius:6px;padding:4px 6px;margin:0 4px 4px 0}.save{position:absolute;right:13px;top:14px;width:28px;height:28px;border-radius:9px;background:transparent;font-size:22px;color:#e8f0eb}.save.saved{color:var(--mint)}.open{display:inline-block;margin-top:12px;border-radius:9px;background:var(--mint);color:#102018;padding:9px 11px;font-size:13px;font-weight:800;box-shadow:0 4px 16px rgba(0,255,148,.18);text-decoration:none}
    .empty{border:1px dashed #405049;border-radius:16px;padding:24px 18px;text-align:center;color:var(--muted);background:#141b21}.empty b{color:var(--ink);display:block;margin-bottom:6px}
    .back{background:none;color:var(--mint);padding:0;font-weight:800;margin:0 0 15px}.back:before{content:'‚Üê ';}.screen{display:none}.screen.active{display:block}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);display:flex;justify-content:space-around;padding:10px 8px max(10px,env(safe-area-inset-bottom));background:rgba(14,19,24,.88);border-top:1px solid #26323a;backdrop-filter:blur(14px)}.nav{background:transparent;font-size:11px;font-weight:700;color:#88938e;display:grid;gap:4px;place-items:center;min-width:58px}.nav-icon{width:20px;height:20px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}.nav.active{color:var(--mint)}
    .result-note{font-size:13px;color:var(--muted);margin:0 0 8px}.hidden{display:none!important}@media(min-width:600px){.phone{min-height:800px;margin:22px auto;border-radius:28px;box-shadow:0 18px 50px rgba(20,35,30,.17)}}
